; PlatformIO Project Configuration File
;
; Project: SUP'COM MIT Project 4 - ESP32 MQTT IoT Node (Hardened with TLS)
; Author: Eya
; Date: November 2026
; Phase: Phase 2 (S4-S6)
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
; Advanced options: extra scripting
;
; Documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor Configuration
monitor_speed = 115200
monitor_filters = 
    default
    time

; Upload Configuration
upload_speed = 921600

; Build Flags for TLS/SSL Support
build_flags = 
    -DCORE_DEBUG_LEVEL=3        ; Debug level (0=None, 3=Info, 5=Verbose)
    -DARDUINO_USB_CDC_ON_BOOT=0 ; USB CDC on boot (0=disabled)
    ; mbedTLS optimizations for ESP32 hardware acceleration
    -DMBEDTLS_KEY_EXCHANGE_RSA_ENABLED
    -DMBEDTLS_SSL_PROTO_TLS1_2          ; TLS 1.2 support
    -DMBEDTLS_AES_HARDWARE_ACCELERATION ; Use ESP32 AES hardware
    -DMBEDTLS_SHA256_HARDWARE_ACCELERATION ; Use ESP32 SHA-256 hardware

; Library Dependencies (same as vulnerable + WiFiClientSecure is built-in)
lib_deps = 
    knolleary/PubSubClient@^2.8          ; MQTT client library
    adafruit/DHT sensor library@^1.4.6   ; DHT11/DHT22 sensor library
    adafruit/Adafruit Unified Sensor@^1.1.14 ; Required by DHT library
    bblanchon/ArduinoJson@^6.21.5        ; JSON serialization/deserialization

; Board Configuration
board_build.mcu = esp32
board_build.f_cpu = 240000000L  ; CPU frequency: 240 MHz
board_build.f_flash = 80000000L ; Flash frequency: 80 MHz
board_build.flash_mode = dio    ; Flash mode: DIO (Dual I/O)

; Partition Scheme (default is sufficient for certificates in PROGMEM)
board_build.partitions = default.csv

; Extra Scripts (optional - for embedding certificates at build time)
; extra_scripts = 
;     pre:scripts/embed_certs.py

; ============================================================================
; NOTES FOR PHASE 2 TLS CONFIGURATION
; ============================================================================
;
; WiFiClientSecure Usage:
; - WiFiClientSecure is built-in to ESP32 Arduino Core (no extra library needed)
; - Provides TLS/SSL client with hardware-accelerated crypto (AES, SHA, RSA)
; - Supports client certificates for mutual TLS (mTLS)
;
; Certificate Embedding:
; 1. Generate certificates using pki/generate_certs.sh or generate_certs.ps1
; 2. Copy src/certs.h.example to src/certs.h
; 3. Paste contents of ca.crt, esp32-client.crt, esp32-client.key into certs.h
; 4. Certificates are stored in PROGMEM (Flash) to save RAM
;
; Hardware Crypto Acceleration:
; - ESP32 has dedicated hardware for AES-128/256 and SHA-256/SHA-512
; - Reduces TLS handshake time by ~30-50% compared to software crypto
; - Enabled via build flags above
;
; RAM Considerations:
; - TLS connection consumes ~40-60 KB of heap (stack + buffers + cert chain)
; - Ensure sufficient free heap before connecting (~80 KB minimum recommended)
; - Monitor with ESP.getFreeHeap() during development
;
; ============================================================================
